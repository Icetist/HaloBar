name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version.h
        shell: pwsh
        run: |
          $v = (Select-String -Path src/version.h -Pattern '#define APP_VER_STR "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "tag ${{ github.ref_name }} does not match version.h ($v)"; exit 1 }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build\obj || exit /b 1
          rc /nologo /fo build\obj\app.res res\app.rc || exit /b 1
          cl /nologo /std:c++20 /O2 /GL /Gw /guard:cf /EHsc /MT /W4 /permissive- /utf-8 /MP /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Fo:build\obj\ src\*.cpp build\obj\app.res /Fe:build\HaloBar.exe /link /LTCG /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /guard:cf /CETCOMPAT /DYNAMICBASE /NXCOMPAT /MANIFEST:NO user32.lib gdi32.lib shell32.lib shlwapi.lib ole32.lib oleaut32.lib advapi32.lib dwmapi.lib d2d1.lib d3d11.lib dxgi.lib dxguid.lib dwrite.lib dcomp.lib windowscodecs.lib version.lib windowsapp.lib bthprops.lib powrprof.lib pdh.lib wbemuuid.lib uuid.lib || exit /b 1

      - name: Hash
        shell: pwsh
        run: (Get-FileHash build/HaloBar.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline -Encoding ascii build/HaloBar.exe.sha256 # the updater refuses exes that don't match

      - name: Clear files from an earlier run of this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($f in 'HaloBar.exe', 'HaloBar.exe.sha256') { gh release delete-asset "${{ github.ref_name }}" $f --yes --repo "${{ github.repository }}" 2>$null } # republishing a version replaces its files
          exit 0

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/HaloBar.exe
            build/HaloBar.exe.sha256
          body_path: .github/release-notes.md # rewrite for each release
